<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulação de Segurança</title>
  <link rel="stylesheet" href="simulacaos.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="title">
      <div class="badge">TREINAMENTO DE SEGURANÇA</div>
      <h1 id="title">Portal Corporativo</h1>
      <p class="subtitle">Acesse sua conta para continuar.</p>

      <form id="loginForm" novalidate>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email"
               placeholder="voce@empresa.exemplo" autocomplete="off" required>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password"
               placeholder="Digite uma senha fictícia" autocomplete="new-password" required>

        <p class="safe-note">
          Ambiente de treinamento: <strong>não use uma senha real</strong>.
        </p>

        <button type="submit">Entrar</button>
        <p id="error" class="error" role="alert" hidden></p>
      </form>

      <footer>Simulação educativa — nenhum dado sensível é transmitido.</footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
